<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Patient Monitor</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <img src="SaIL.png" alt="SaIL logo" class="logo">

<!-- MONITOR VIEW -->
<div class="monitor-wrap" id="monitorView">
  <div class="monitor">
    <div class="panel">
      <div class="qr-title">Monitor</div>
      <div class="monitor-stage">
          <div class="viewer-fab">
            <button id="fsBtn" class="btn-ghost" type="button">Fullscreen</button>
          </div>
        <div class="monitor-grid-wrap">
        <div class="monitor-grid">
          <div class="waveforms">
            <div class="wave-row">
              <div class="wave-main">
                <div class="wave-label" style="color:#00ff41">ECG - II</div>
                <canvas class="wave" id="ecgC" width="480" height="70"></canvas>
              </div>
              <div class="num-card ecg wave-metric">
                <div class="num-label">HR bpm</div>
                <div class="num-value" id="hr">72</div>
                <div class="num-sub" style="color:#4a8a4a" id="rhythm">NSR</div>
              </div>
            </div>
            <div class="wave-row">
              <div class="wave-main">
                <div class="wave-label" style="color:#00aaff">SpO2 - Pleth</div>
                <canvas class="wave" id="spo2C" width="480" height="70"></canvas>
              </div>
              <div class="num-card spo2n wave-metric">
                <div class="num-label">SpO2 %</div>
                <div class="num-value" id="spo2">98</div>
              </div>
            </div>
            <div class="wave-row">
              <div class="wave-main">
                <div class="wave-label" style="color:#ffaa00">Resp</div>
                <canvas class="wave" id="respC" width="480" height="70"></canvas>
              </div>
              <div class="num-card resp wave-metric">
                <div class="num-label">RR br/min</div>
                <div class="num-value" id="rr">16</div>
              </div>
            </div>
          </div>
          <div class="aux-numerics">
            <div class="num-card nibp">
              <div class="num-label" style="color:#cc4488">NIBP mmHg</div>
              <div class="num-value" id="nibp">120/80</div>
              <div class="num-sub" style="color:#aa4477" id="map">MAP 93</div>
            </div>
            <div class="num-card temp">
              <div class="num-label">Temp C</div>
              <div class="num-value" id="temp">36.7</div>
            </div>
          </div>
        </div>
        </div>
      </div>
    </div>
    <div class="panel monitor-footer">
        <div class="qr-title">Controller</div>
        <div class="qr-box">
          <div class="qr-card" id="qr-wrap"><img id="qrImage" alt="Controller QR code"></div>
        <div class="room-info">
          <div>
            <div class="room-id" id="roomIdLabel">starting...</div>
          </div>
          <div class="monitor-note">Using another device, scan this QR code or copy the above URL to open the controller page.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- CONTROLLER VIEW -->
<div class="ctrl-wrap" id="controllerView">
  <div id="ctrlStatus" class="ctrl-status">Connecting…</div>
  <div class="ctrl-section">
    <div class="ctrl-heading">Rhythm</div>
    <select class="rhythm-select" id="rhythmSelect" aria-label="Rhythm selector">
      <option value="NSR">Sinus</option>
      <option value="VF">VF</option>
      <option value="VT">VT</option>
    </select>
  </div>
  <div class="ctrl-section">
    <div class="ctrl-heading">Observations</div>
    <div class="obs-rows" id="obsRows"></div>
    <div style="margin-top:14px;display:flex;justify-content:center;">
      <button id="holdBtn" class="hold-btn" type="button">Hold</button>
    </div>
  </div>
</div>
</div>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="https://unpkg.com/nosleep.js@0.12.0/dist/NoSleep.min.js"></script>
<script src="script.js"></script>
</body>
</html>
